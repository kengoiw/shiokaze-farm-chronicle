function parse(text){requireCondition(typeof text==='string'&&text.length<=12000000,'セーブファイルが大きすぎます。');let e;try{e=JSON.parse(text)}catch{throw new Error('JSONを読み取れません。ファイルは変更していません。')}requireCondition(e&&e.format==='SHIOKAZE_FARM'&&[1,2,3,4,5].includes(e.version)&&typeof e.payload==='string'&&e.checksum===checksum(e.payload),'形式またはチェックサムが不正です。破損した保存は読み込みません。');let s=JSON.parse(e.payload);requireCondition(s&&s.schemaVersion===e.version,'保存の版番号が一致しません。');if(e.version===1&&s.schemaVersion===1){s.schemaVersion=2;s.milestones=s.milestones||[];s.loans=s.loans|| (s.debt>0?[{balance:s.debt,payment:s.loanPayment}]:[]);s.leaders.forEach(l=>{if(l.yearSales===undefined)l.yearSales=l.generation===s.generation?s.accounts.revenue:0})}if(s.schemaVersion===2){s.cropSettings=defaultCropSettings();s.priceFactors={};for(let k of Object.keys(CROPS))s.priceFactors[k]=s.prices?.[k]/CROPS[k].price;s.schemaVersion=4;}if(s.schemaVersion===3){fillLegacySettings(s,3);s.schemaVersion=4;}if(s.schemaVersion===4){fillLegacySettings(s,4);requireCondition(Array.isArray(s.plots),'土地データが不正です。');for(let p of s.plots){if(p.crop){requireCondition(owns(CROPS,p.crop.id),'生育データが不正です。');p.crop.laborPer10a=s.cropSettings[p.crop.id].labor;p.crop.laborBasis='migrated';}}s.schemaVersion=5;}return validate(s)}

const F=Farm,$=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),KEY='shiokaze-farm:v2',BACKUP=KEY+':backup',RECOVERY=KEY+':recovery';let state,tab='farm',saveMessage='',saveBad=false,corruptRaw=null,saveBlocked=false,conflictBlocked=false,recoveredBackup=false,lastPersisted=null,toastTimer,confirmHandler=null,processing=false,viewYear='current';

function load(){try{let raw=localStorage.getItem(KEY);lastPersisted=raw;if(raw){try{state=F.parse(raw);saveMessage='● 端末の保存から再開';return}catch(e){corruptRaw=raw;saveBlocked=true;saveBad=true;let b=localStorage.getItem(BACKUP);if(b){try{state=F.parse(b);recoveredBackup=true;saveMessage='要確認：前回のバックアップを表示中';return}catch{}}saveMessage='保存が破損しています。元データを保護中';}}state=F.create();if(!saveBlocked)save();}catch(e){state=state||F.create();saveBad=true;saveMessage='端末保存を利用できません。書き出しをご利用ください。'}}
function save(){if(saveBlocked)return false;try{let data=F.serialize(state),previous=localStorage.getItem(KEY);if(previous!==lastPersisted){saveBlocked=true;conflictBlocked=true;saveBad=true;saveMessage='別タブで保存が変わりました。この進行を書き出し、再読み込みしてください。';renderSave();return false;}if(previous){try{F.parse(previous);protectLegacy(previous);localStorage.setItem(BACKUP,previous)}catch{throw Error('現在の保存が破損しています')}}localStorage.setItem(KEY,data);if(localStorage.getItem(KEY)!==data)throw Error('保存照合に失敗');lastPersisted=data;saveBad=false;saveMessage='● 自動保存済み · この端末';}catch(e){saveBad=true;saveMessage='保存できません。今の進行を書き出してください。'}renderSave();return !saveBad;}

function expectedTasks(){const tasks={4:['ハウスの作付けを決めて定植','水田の計画を確認。田植えは5月','近隣からの土地の話を検討'],5:['水稲の田植え。今月の計画で確定','ハウスの手入れと苗の管理'],6:['トルコギキョウ・スターチスの出荷開始','水田と秋小麦の管理'],7:['前年にまいた秋小麦を収穫','メロンの出荷開始'],8:['メロンの最終出荷','秋まき小麦の次の作付けを検討'],9:['水稲を収穫','秋まき小麦を播種。収穫は翌年7月'],10:['トルコギキョウ・スターチスの最終出荷','秋小麦の生育を見守る'],11:['農機の手入れ、冬の資金繰りを確認','冬に家計・雇用・維持費4か月分と返済'],12:['12〜3月をまとめて進め、年度決算','秋小麦は畑に残したまま越冬','借入利息・元金返済・地代の支払い']};return tasks[state.month]}
function stat(label,val,sub,negative=false){return`<div class="stat"><label>${label}</label><div class="value ${negative?'negative':''}">${val}</div><small>${sub}</small></div>`}
function stats(){return`<div class="stats">${stat('手元資金',money(state.cash),`借入 ${money(state.debt)}`,state.cash<0)}${stat('経営面積',area(F.area(state)),`水田 ${area(F.area(state,'paddy'))} · 畑 ${area(F.area(state,'field'))}`)}${stat('ハウス',`${state.plots.filter(p=>p.type==='house').length}<span style="font-size:13px"> 棟</span>`,`1棟 3a · 合計 ${area(F.area(state,'house'))}`)}${stat('家族の歩み',`第${state.generation}<span style="font-size:13px"> 代</span>`,`${state.age}歳 · ${F.TALENTS[state.talent].name}`)}</div>`}
function landscape(){let winter=state.month===12,autumn=state.month>=9&&state.month<=11;let ground=winter?'#eaf0e9':autumn?'#c8c18c':'#b9cb9c',field=winter?'#dde6dd':autumn?'#c6a268':'#97b178';return`<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="日本海を望む農場の風景"><defs><pattern id="rows" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)"><path d="M0 0V13" stroke="#f5f3dc" stroke-opacity=".5" stroke-width="3"/></pattern></defs><circle cx="464" cy="53" r="24" fill="#e2ca8f"/><path d="M0 116L80 59 157 94 224 47 314 107 398 83 486 121 600 96V215H0" fill="#c1cebd"/><path d="M0 125Q120 109 225 139T600 124V226H0" fill="#c0d4cf"/><path d="M5 143Q230 156 600 136" fill="none" stroke="#e7ede4" stroke-width="3"/><path d="M0 191Q205 109 600 176V300H0Z" fill="${ground}"/><path d="M-30 270L127 194 276 209 141 300H0Z" fill="${field}"/><path d="M-30 270L127 194 276 209 141 300H0Z" fill="url(#rows)"/><path d="M187 300L311 219 461 238 399 300" fill="${winter?'#e4eae1':'#b7cebd'}"/><path d="M190 300L311 219 462 238M228 300L334 223M274 300L372 228M321 300L409 233M367 300L444 236" fill="none" stroke="#e4e8cc" stroke-width="4"/><path d="M143 300L285 200Q301 182 383 168" fill="none" stroke="#e9ddbb" stroke-width="16"/><path d="M143 300L285 200Q301 182 383 168" fill="none" stroke="#d8caaa" stroke-width="2"/><g transform="translate(360 140)"><path d="M0 40L45 18 102 34V85L57 105 0 87Z" fill="#e9e6d2"/><path d="M45 18L57 51 57 105 0 87V40Z" fill="#f6f0db"/><path d="M-7 39L44 9 109 32 57 61Z" fill="#8d5c45"/><path d="M44 9L57 61 109 32Z" fill="#6e4f3e"/><path d="M19 67L39 73V96L19 90Z" fill="#647868"/><path d="M70 60L86 54V70L70 76Z" fill="#7f9a90"/></g><g transform="translate(461 211)"><path d="M0 27Q0-4 25 2L79 15Q96 20 96 42L23 60 0 48Z" fill="#edf2e7" stroke="#9bab97" stroke-width="2"/><path d="M23 60V38Q23 9 0 12M48 54V34Q48 10 29 8M73 48V28Q73 13 55 12" stroke="#b5c6ae" fill="none" stroke-width="2"/></g><g fill="#6b8969"> function farm(){let subtitle=state.month===4?'また、春が来た。':state.month===12?'雪の下に、次の春。':state.month>=9?'実りを、次の一歩に。':'この畑から、未来へ。';return`<section class="hero"><div class="hero-copy"><div class="eyebrow">A FAMILY FARM, FOR GENERATIONS</div><h2>${subtitle}<br>農場の物語をつなごう。</h2><p>何を育て、どこまで広げるか。<br>日本海の風とともに、あなたの選択が実っていく。</p></div><div class="hero-art">${landscape()}</div></section>${stats()}<div class="grid2"><div class="panel"><div class="tag-line"><span class="badge">${state.year}年目の${monthText(state.month)}</span><span class="badge gold">${F.WEATHER[state.weather].name}の年</span></div><h3>今月、農場でやること</h3><ul class="task-list">${expectedTasks().map(t=>`<li><i class="task-dot"></i>${t}</li>`).join('')}</ul><div class="month-track">${F.MONTHS.map(m=>`<div class="month-cell ${m===state.month?'current':m<state.month?'past':''}">${m===12?'冬':m+'月'}</div>`).join('')}</div><div class="hint">${F.WEATHER[state.weather].description}</div></div>${workloadPanel()}</div><div class="section-heading"><h3>あなたの土地</h3><button class="small quiet" data-goto="plan">作付けを考える →</button></div><div class="plot-grid">${state.plots.map(plotCard).join('')}</div>${offers()}${equipment()}`}
function offers(){return`<div class="section-heading"><h3>近隣からの土地の話</h3><span class="hint">募集は今年の冬まで</span></div><div class="panel"><p class="subtitle">離農する農家から声がかかりました。購入・借用後は作付けを設定してください。</p>${state.offers.map(o=>`<div class="offer"><strong>${typeName(o.type)} ${area(o.areaA)}</strong> <span class="badge">${o.type==='paddy'?'海沿いの平坦な区画':'ゆるやかな丘の区画'}</span><div class="hint">購入 ${money(o.price)} ／ 借地 年${money(o.rent)}（初年度も全額、継続契約）</div>${o.status==='open'?`<div class="offer-actions"><button class="small" data-offer="${esc(o.id)}" data-mode="buy" ${state.gameOver?'disabled':''}>購入する</button><button class="small" data-offer="${esc(o.id)}" data-mode="rent" ${state.gameOver?'disabled':''}>借りる</button><button class="small quiet" data-offer="${esc(o.id)}" data-mode="decline" ${state.gameOver?'disabled':''}>見送る</button></div>`:`<span class="badge">${{buy:'購入済み',rent:'借用済み',declined:'今年は見送り'}[o.status]}</span>`}</div>`).join('')}</div>`}
function equipment(){return`<div class="section-heading"><h3>農場を育てる</h3><span class="hint">拡大する前に、作業能力を確認</span></div><div class="equipment"><div class="equip-card"><div class="icon">⌒</div><strong>ハウスを建てる</strong><div class="hint">1棟 3a（300㎡）<br>維持費 2.4万円/年・作付けは4月</div><button data-buy="build" ${state.gameOver?'disabled':''}>建設 · 130万円</button></div><div class="equip-card"><div class="icon">▰</div><strong>トラクター ${state.machines.tractor}台</strong><div class="hint">1台の能力 8ha/月<br>維持費 18万円/年</div><button data-buy="tractor" ${state.gameOver?'disabled':''}>購入 · 600万円</button></div><div class="equip-card"><div class="icon">▥</div><strong>コンバイン ${state.machines.combine}台</strong><div class="hint">1台の収穫能力 6ha/月<br>維持費 24万円/年</div><button data-buy="combine" ${state.gameOver?'disabled':''}>購入 · 800万円</button></div></div><div class="panel" style="margin-top:16px"><h3>家族とパート</h3><p class="subtitle">家族 ${state.familyHours}時間/月。パート1人で120時間/月追加。賃金は18万円/月、冬の4か月も支払います。</p><div class="stepper"><button data-hire="-1" aria-label="パートを1人減らす" ${!state.workers||state.gameOver?'disabled':''}>−</button><strong>${state.workers}人</strong><button data-hire="1" aria-label="パートを1人増やす" ${state.workers>=30||state.gameOver?'disabled':''}>＋</button></div></div>`}
function plan(){return`<h2 class="section-title">作付け計画</h2><p class="subtitle">収量より先に、できる仕事量を。区画ごとに今年の作物を決めよう。</p><div class="banner">「次へ」で今月を処理した時点で植え付けます。水稲は5月まで、ハウスは4月、秋小麦は9月まで変更可能。前年の小麦は7月までそのまま育ちます。</div><div class="grid2"><div><div class="plan-grid">${state.plots.map(p=>{let c=p.crop?F.CROPS[p.crop.id]:null,editable=F.editable(state,p);return`<article class="plan-card"><div class="plot-head"><strong>${esc(p.name)}</strong><span class="badge">${typeName(p.type)} ${area(p.areaA)}</span></div><div class="hint" style="margin-top:8px">${c?`現在：${c.name}（${p.crop.plantedYear}年目植付）`:'現在：未作付け'}<br>${fixedLabor(p)}</div><label for="plan-${p.id}">${p.type==='field'?'今年9月にまく作物':'今年の作付け'}</label><select id="plan-${p.id}" data-plan="${p.id}" ${editable?'':'disabled'}><option value="fallow" ${p.plan==='fallow'?'selected':''}>休耕する</option>${Object.entries(F.CROPS).filter(([k,c])=>c.type===p.type).map(([k,c])=>`<option value="${k}" ${p.plan===k?'selected':''}>${c.name}</option>`).join('')}</select><div class="hint" style="margin-top:8px">${editable?'変更すると自動保存されます。':'今季の作付けは確定済み。翌年の適期に変更できます。'}</div></article>`}).join('')}</div></div><div>${workloadPanel()}<div class="panel"><h3>今年の市場</h3><p class="hint">単価は設定した基準値と年内固定の市場倍率で決定。平年の豊作傾向では米価が下がりやすくなります。</p>${Object.entries(F.CROPS).map(([k,c])=>`<div class="ledger-row"><span>${c.name}</span><strong>${fmt(state.prices[k])}円 / ${c.unit}</strong></div>`).join('')}<p class="hint">天候：${F.WEATHER[state.weather].name}<br>${F.WEATHER[state.weather].description}</p></div></div></div><div class="section-heading"><h3>作物の手引き</h3><span class="hint">設定基準・10aあたり（労働は次の植付用）</span></div><div class="panel table-scroll"><table><thead><tr><th>作物</th><th>基準収量</th><th>基準単価</th><th>直接経費</th><th>労働</th><th>植付 → 出荷</th></tr></thead><tbody>${Object.entries(F.CROPS).map(([k,c])=>`<tr><td>${c.name}</td><td>${fmt(state.cropSettings[k].yield)}${c.unit}</td><td>${state.cropSettings[k].price}円</td><td>${money(state.cropSettings[k].cost)}</td><td>${state.cropSettings[k].labor}時間</td><td>${c.plant}月 → ${c.name==='秋まき小麦'?'翌年7月':c.harvest[0]===c.harvest.at(-1)?c.harvest[0]+'月':c.harvest[0]+'〜'+c.harvest.at(-1)+'月'}</td></tr>`).join('')}</tbody></table><p class="hint">1ha＝100a＝10 × 10a。ハウス1棟は3aなので、この表の0.3倍。経費は植付月に全額、売上は出荷月に均等分割。気象・労働・才能で実収量が変動します。機械・人件費・家計は表に含みません。</p></div>`}
function accounts(){let a=viewYear==='current'?state.accounts:state.history.find(h=>h.year===Number(viewYear))||state.accounts;let isCurrent=a===state.accounts,profit=isCurrent?F.profit(state):a.profit,expenses=['inputs','wages','maintenance','living','rent','interest'].reduce((v,k)=>v+a[k],0);let names={inputs:'種苗・肥料など',wages:'パート人件費',maintenance:'機械・ハウス維持費',living:'家計への支出',rent:'借地料',interest:'借入利息'};return`<h2 class="section-title">決算・資金</h2><p class="subtitle">売上と利益、そして手元に残るお金。それぞれを見ながら、次の一手を。</p><label for="account-year" class="hint">表示年度</label><select id="account-year" style="max-width:250px;margin:5px 0 20px"><option value="current">${state.year}年目（進行中${state.gameOver?'・終了':''}）</option>${[...state.history].reverse().map(h=>`<option value="${h.year}" ${String(viewYear)===String(h.year)?'selected':''}>${h.year}年目の決算</option>`).join('')}</select><div class="stats">${stat('農産物売上',money(a.revenue),'借入金は含みません')}${stat('経常支出',money(expenses),'家計を含む現金支出')}${stat('収支',money(profit),'売上 − 経常支出',profit<0)}${stat('投資・元金返済',money(a.investment+a.principal),'収支とは別の資金移動')}</div><div class="grid2"><div><div class="panel"><h3>作物別の収支</h3><div class="table-scroll"><table><thead><tr><th>作物</th><th>売上</th><th>直接経費</th><th>差引</th></tr></thead><tbody>${Object.entries(F.CROPS).map(([k,c])=>`<tr><td>${c.name}</td><td>${money(a.crops[k].revenue)}</td><td>${money(a.crops[k].cost)}</td><td class="${a.crops[k].revenue<a.crops[k].cost?'negative':''}">${money(a.crops[k].revenue-a.crops[k].cost)}</td></tr>`).join('')}</tbody></table></div><p class="hint">現金の出入りを年ごとに記録します。秋小麦の経費は9月、売上は翌年7月のため、初年度は経費だけです。差引には共通の人件費・機械費・家計等を含みません。</p></div><div class="panel"><h3>支出の内訳</h3>${Object.entries(names).map(([k,n])=>`<div class="ledger-row"><span>${n}</span><strong>${money(a[k])}</strong></div>`).join('')}</div></div><div><div class="panel"><h3>資金のつながり</h3><div class="ledger-row"><span>期首資金</span><strong>${money(a.openingCash)}</strong></div><div class="ledger-row"><span>収支</span><strong>${money(profit)}</strong></div><div class="ledger-row"><span>＋ 新規借入</span><strong>${money(a.borrowing)}</strong></div><div class="ledger-row"><span>− 設備・土地投資</span><strong>${money(a.investment)}</strong></div><div class="ledger-row"><span>− 元金返済</span><strong>${money(a.principal)}</strong></div><div class="ledger-row total"><span>${isCurrent?'現在':'期末'}資金</span><strong>${money(isCurrent?state.cash:a.closingCash)}</strong></div><p class="hint">減価償却や税金は扱わない、ゲーム用の現金ベース決算です。</p></div><div class="panel"><h3>農協の融資窓口</h3><div class="ledger-row"><span>借入残高</span><strong>${money(state.debt)}</strong></div><div class="ledger-row"><span>今年冬の元金返済予定</span><strong>${money(Math.min(state.debt,state.loanPayment))}</strong></div><div class="ledger-row"><span>追加で借りられる額</span><strong>${money(Math.max(0,F.debtLimit(state)-state.debt))}</strong></div><p class="hint">年利3%。借入ごとに10年の元金均等返済。借入月にかかわらず、その冬から返済と年利全額が発生します。繰上返済は古い借入から充当します。</p><label for="loan-amount" class="hint">金額（万円・10万円単位）</label><div class="finance-form"><input id="loan-amount" type="number" min="10" step="10" value="100" aria-label="借入・返済額（万円）"><button data-ui="borrow" ${state.gameOver?'disabled':''}>借りる</button><button data-ui="repay" ${state.gameOver?'disabled':''}>返す</button></div></div></div></div>${historyChart()}`}
function historyChart(){let h=state.history.slice(-12),max=Math.max(1,...h.map(h=>h.revenue));return`<div class="panel"><h3>売上の歩み</h3>${h.length?`<div class="chart" aria-label="過去12年までの売上グラフ">${h.map(v=>`<div class="chart-col" title="${v.year}年目 ${money(v.revenue)}"><div class="chart-bar" style="height:${Math.max(2,v.revenue/max*110)}px"></div><small>${v.year}年</small></div>`).join('')}</div>`:'<p class="hint">最初の冬を越えると、決算がここに並びます。</p>'}</div>`}
function timeline(){return`<h2 class="section-title">家族の年表</h2><p class="subtitle">ひとつの畑から、何世代もの物語へ。</p><div class="leader-list">${state.leaders.map((l,i)=>`<article class="leader-card ${i===state.leaders.length-1?'current':''}"><div class="leader-number">${String(l.generation).padStart(2,'0')}</div><h3>${esc(l.name)}</h3><div class="hint">${l.startYear}年目〜${l.endYear?l.endYear+'年目':'現在'}<br>${F.TALENTS[l.talent].name}</div><div class="ledger-row"><span>最高年間売上</span><strong>${money(l.peakSales)}</strong></div><div class="ledger-row"><span>最大経営面積</span><strong>${area(l.peakArea)}</strong></div></article>`).join('')}</div><div class="panel"><h3>次の世代へ</h3><p class="subtitle">61歳から、いつでも経営を引き継げます。土地・機械・資金・借入はそのまま。28歳の後継者が農場の続きを歩みます。</p><button data-ui="succeed" ${state.age<=60||state.gameOver?'disabled':''}>${state.age>60?'後継者を選ぶ':`世代交代まで あと${61-state.age}年`}</button><p class="hint">継承した年の売上は、それぞれの経営期間に得た分を記録します。</p></div><div class="section-heading"><h3>農場のできごと</h3><span class="hint">新しい順・直近80件表示</span></div><div class="timeline">${state.events.slice(-80).reverse().map(e=>`<div class="timeline-item"><small>${e.year}年目 · ${monthText(e.month)}</small><p>${esc(e.text)}</p></div>`).join('')}</div>`}
function settings(){return`<h2 class="section-title">作物の設定</h2><p class="subtitle">あなたの農場に合わせて、単価・収量・経費・労働時間の基準を変えられます。</p><div class="banner"><strong>ゲーム用の設定です。</strong>実際の営農推奨値ではありません。<br>単価・収量：保存後、次に処理する出荷から反映（栽培中の作物・越冬中の小麦を含む）。<br>経費：次の植付から反映。労働：次の植付から反映。栽培中の作物は今作の固定値を収穫まで使います。<br>支払済みの経費・出荷済みの売上・過去の決算・すでに低下した生育状態は変更しません。</div><div class="panel"><h3>基準値を編集</h3><p class="hint">入力後に「設定を保存」を押してください。保存前に画面を移動すると、入力は破棄されます。<br>すべて0以上の整数。単価は最大10,000円、収量は最大100,000（kgまたは本）/10a、経費は最大10,000,000円/10a、労働は最大10,000時間/10a/年。年間労働時間は月ごとではなく<strong>10a・1作分の合計</strong>です。秋小麦は9月〜翌7月の越年1作として配分します。経費の入力単位は<strong>万円ではなく円</strong>です。</p><div class="settings-grid">${Object.entries(F.CROPS).map(([k,c])=>{let v=state.cropSettings[k];return`<section class="settings-card"><div class="plot-head"><strong>${c.name}</strong><span class="badge">${typeName(c.type)}</span></div><div class="settings-inputs">${[['price',`基準単価（円/${c.unit}）`],['yield',`基準収量（${c.unit}/10a）`],['cost','直接経費（円/10a）'],['labor','年間労働時間（時間/10a/年）']].map(([f,label])=>`<div><label for="setting-${k}-${f}">${label}</label><input id="setting-${k}-${f}" type="number" inputmode="numeric" min="0" max="${F.SETTING_LIMITS[f].max}" step="1" value="${v[f]}" ${state.gameOver?'disabled':''}></div>`).join('')}</div><div class="hint">保存中の基準単価 ${fmt(v.price)}円 × 今年の市場倍率 ${state.priceFactors[k].toFixed(3)} ≒ 実売単価 ${fmt(state.prices[k])}円/${c.unit}<br>初期値：単価 ${fmt(c.price)}円/${c.unit} ／ 収量 ${fmt(c.yield)}${c.unit}/10a ／ 経費 ${fmt(c.cost)}円/10a ／ 労働 ${fmt(c.labor)}時間/10a/年</div></section>`}).join('')}</div><div class="settings-actions"><button class="primary" data-ui="settings-save" ${state.gameOver?'disabled':''}>設定を保存</button><button data-ui="settings-reset" ${state.gameOver?'disabled':''}>5作物を初期値に戻す</button></div><p class="hint">この農場のセーブに保存されます。新しい農場を始めると初期設定になります。初期値復元も同じ反映時点です。年間労働は栽培中の作物には適用されず、次の植付待ちになります。</p></div><div class="panel"><h3>設定値から収支が決まるまで</h3><p>実売単価 ＝ 基準単価 × その年の市場倍率（1円に丸め）。倍率は年度内で固定し、設定保存・初期値復元では再抽選しません。</p><p>出荷量 ＝ 基準収量 × 面積 ÷ 10a × 天候 × 生育状態 × 得意分野 ÷ 出荷月数。保存後の未処理分だけ、新しい基準収量を使います。</p><p>植付経費 ＝ 設定した経費 × 面積 ÷ 10a（1円に丸め）。植付済みの区画へ追加請求したり返金したりしません。</p><p class="hint">ハウス1棟は3aなので10a基準の0.3倍、1haの区画は10倍です。作期・月別配分・天候の影響率はこの画面では変更しません。水稲・秋小麦・メロンはkg、花2種は本で計算します。極端な設定はゲームバランスを大きく変えます。</p></div><div class="panel"><h3>年間労働時間の月別配分</h3><p>月の作業需要 ＝ 今作に固定した年間労働時間 × 面積 ÷ 10a × 下の月別割合。未植付の予測には、次の植付用に保存した設定を使います。栽培中の全区画の需要を合計し、家族320時間＋パート120時間/人の月次能力と比べます（機械に強い後継者は能力＋12%）。</p><p>例えば水稲100時間/10aを1ha作付けすると、5月は100 × 10 × 30%＝300時間。保存した年間労働時間は、次にその区画へ植え付けるときに固定します。植付後に設定を変更・初期値復元しても、今作の必要時間は変わりません。秋小麦も翌7月の収穫まで同じ値です。</p><div class="table-scroll"><table><thead><tr><th>作物</th><th>1作分の配分（合計100%）</th></tr></thead><tbody>${Object.entries(F.CROPS).map(([k,c])=>`<tr><td>${c.name}</td><td>${Object.keys(c.work).map(Number).sort((a,b)=>(a>=c.plant?a:a+12)-(b>=c.plant?b:b+12)).map(m=>`${m<c.plant?'翌':''}${m}月 ${Math.round(c.work[m]*100)}%`).join(' / ')}</td></tr>`).join('')}</tbody></table></div><p>秋小麦は9〜11月と翌4〜7月に配分。冬（12〜3月）の作物作業は0時間で、4か月分を重ねて加算しません。賃金など固定費は従来どおり4か月分です。</p><p>需要が能力を超えると、その月の能力/需要の比率に応じて生育状態が低下し、今後の収量が落ちます。過去の低下は設定を軽くしても回復しません。今作の固定労働が0時間の作物は労働不足の影響を受けませんが、農機不足による低下は別に残ります。</p><p class="hint">労働時間を変えても家族・パートの能力、雇用人数、賃金、農機のha上限は変わりません。作付け済み経費の追加請求もありません。</p></div>`}
function readSettingsInputs(){let values={};for(let [k,c]of Object.entries(F.CROPS)){values[k]={};for(let f of ['price','yield','cost','labor']){let raw=$(`#setting-${k}-${f}`).value.trim();if(!/^\d+$/.test(raw))throw Error(`${c.name}の${{price:'単価',yield:'収量',cost:'経費',labor:'労働時間'}[f]}は0以上の整数で入力してください。`);values[k][f]=Number(raw);}}return F.validateCropSettings(values)}
function protectLegacy(raw){if(!raw)return;let envelope=JSON.parse(raw);if(envelope.format!=='SHIOKAZE_FARM'||envelope.version>=5)return;F.parse(raw);let key=KEY+':legacy:'+F.checksum(raw),stored=localStorage.getItem(key);if(stored!==null&&stored!==raw)throw Error('旧保存の退避先が一致しません。元のJSONを上書きせず停止しました。');if(stored===null)localStorage.setItem(key,raw);if(localStorage.getItem(key)!==raw)throw Error('旧保存の退避を確認できません。書き出して保管してください。');}
function help(){return`<h2 class="section-title">遊び方</h2><p class="subtitle">急がず、ひと月ずつ。大きな農場も、ひとつの作付けから。</p><div class="panel"><h3>最初の一年</h3><ol><li>4月に「作付け計画」でハウスの作物を選ぶ。</li><li>5月に田植え。水田の計画と今月の作業量を確認する。</li><li>6月から花、7〜8月にメロン、9月に米を販売する。</li><li>9月に秋小麦をまく。初年度の小麦収入はなく、翌年7月に収穫。</li><li>冬は4か月をまとめて進めて決算。次の春に、農場を広げる。</li></ol><p class="hint">最初から全区画に計画が入っています。そのまま進めても遊べます。初期資金は1,200万円、水田5ha、畑2ha、ハウス3a×2棟、農機は各1台です。</p></div><div class="panel"><details open><summary>時間と作付け</summary><p>画面は「これから作業する月」です。右上のボタンで確認し、その月の植付・手入れ・販売・支払いを処理します。4〜11月は月次、12〜3月は冬1ターン。計9ターンで1年です。冬の後に1歳加齢し、市場・天候・土地募集が更新されます。</p><p>水田は水稲、畑は秋小麦、ハウスは花2種かメロンを1作。休耕もできます。計画は翌年へ引き継がれます。新しい土地・ハウスは休耕から始まります。秋小麦の株は計画を変更しても7月の収穫まで残ります。</p></details><details><summary>面積と作業の上限</summary><p>1ha＝100a、10a＝1,000㎡です。ハウスは1棟3a＝300㎡。収量・経費・労働は面積に比例します。家族は320時間/月、パートは120時間/月。トラクター1台で植付8ha/月、コンバイン1台で収穫6ha/月です。</p><p>作業を詰め込みすぎると、その月の能力不足が生育に積み重なり、収量が下がります。土地を増やす前にピーク月を考えましょう。管理上限は200区画、パート30人、農機は各30台です。</p></details><details><summary>お金、借入、離農</summary><p>種苗などの直接経費は植付時、収入は出荷時に発生します。機械とハウスの維持費・家計15万円/月・パート18万円/月は毎月支払い。冬は4か月分、さらに借地料・借入利息3%・元金返済を支払います。大雪の年はハウス1棟あたり除雪・補修3万円が追加されます。</p><p>借入は10万円単位。借入ごとに元金を10年に分け、その冬から返済します。途中で借りても年利全額がかかります。繰上返済は手元資金内で可能。借地は継続契約で、返却・土地売却・機械売却はありません。</p><p>各年度末の「手元資金」がマイナスのまま3年連続すると離農します。単年の赤字収支や借入残高では判定しません。終了後は年表・決算・保存のみ利用できます。</p></details><details><summary>価格・天候・世代交代</summary><p>天候は平年・冷夏・猛暑・長雨・大雪の5種類。気象と作物の相性で収量が変わります。市場倍率は年度中固定です。設定の基準単価を変更すると今後の出荷単価が再計算されます。米は豊作傾向の平年に安くなりやすい設定です。農業の実際の予測をするものではありません。</p><p>61歳から年表で後継者を選べます。稲作が得意なら米の収量8%増、花が得意なら花2種8%増、機械に強いなら労働と農機の能力12%増。引き継いだ後継者は28歳から始まります。</p></details><details><summary>保存、バックアップ、スマートフォン</summary><p>操作ごとにブラウザのlocalStorageへ自動保存し、ひとつ前の保存も保持します。保存できない環境では警告を表示します。プライベートモード、ブラウザデータの削除、HTMLの移動や別ブラウザでは保存が消えたり分かれたりするため、節目にJSONを書き出してください。</p><p>別端末への移行は「書き出し」→ JSONファイルを移動 → 同じHTMLで「読み込み」。JSONの形式・数値・チェックサムを検証してから、確認後に置き換えます。互換形式v1〜v4はv5へ読み替えます。既存の作物設定は保持し、不足する項目だけ初期値で補完します。旧データに植付時の労働値はないため、栽培中の作物は読込時の保存設定（設定がなければ初期値）で今作を固定します。過去の生育や会計は変えません。別ゲームのセーブには対応しません。現在の保存は読み込み時にもバックアップされます。旧形式のJSONは移行前に別領域へ退避して保護します。退避を確認できない場合は上書き保存しません。</p><p>壊れた保存は自動で上書きせず、バックアップがあれば表示します。復旧を確定する前に破損ファイルもダウンロードできます。書き出したファイルはあなた自身で安全に保管してください。スマートフォンは表示対応していますが、端末によってローカルHTMLの実行や保存に制限があります。</p></details><details><summary>このゲームについて</summary><p>潮凪町は北海道の日本海側をイメージした架空の町です。すべての経営値は遊びやすさのための仮定。実際の営農や融資・投資の推奨ではありません。外部通信、サーバー、アカウント、課金はありません。</p><p>バージョン1.3.0 / セーブ形式5。会計は税・減価償却を省略した現金ベース。作物別差引は共通費配賦前です。決算・世代記録は保持し、細かな出来事は直近1,200件を保存します。</p></details></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});$('#year-label').textContent=`${state.year}年目`;$('#month-label').textContent=state.month===12?'冬':`${state.month}月`;$('#age-label').textContent=`${state.age}歳`;$('#weather-icon').textContent=F.WEATHER[state.weather].icon;$('#weather-name').textContent=F.WEATHER[state.weather].name;$('#next-turn').textContent=state.gameOver?'経営を終えました':state.month===12?'冬を越えて、次の春へ':`${state.month}月を終える` ;$('#next-turn').disabled=state.gameOver;let banners='';if(conflictBlocked)banners+='<div class="banner danger"><strong>別タブで保存が変更されました。</strong><br>上書きを防ぐため自動保存を停止中です。必要なら現在の進行を書き出し、ページを再読み込みしてください。</div>';else if(saveBlocked)banners+=`<div class="banner danger"><strong>保存の破損を検出しました。</strong><br>元データは上書きしていません。${recoveredBackup?'読み取れたバックアップ':'新しい仮の農場'}を表示中です。<br><button data-ui="corrupt-export" class="small">破損データを書き出す</button><button data-ui="recover" class="small">この状態で復旧を確定</button></div>`;if(state.gameOver)banners+='<div class="banner danger"><strong>農場の物語に、ひと区切り。</strong><br>年度末の手元資金が3年連続でマイナスとなり、離農しました。年表は残っています。セーブを書き出すか、新しい農場を始められます。</div>';else if(state.negativeYears)banners+=`<div class="banner danger">年末資金が${state.negativeYears}年連続でマイナスです。3年連続で離農します。冬の支払い前に資金繰りを確認してください。</div>`;if(state.age>60&&!state.gameOver)banners+='<div class="banner">次の世代へ託せる年齢になりました。「年表」から後継者を選べます。</div>';$('#alerts').innerHTML=banners;$('#content').innerHTML=({farm,plan,accounts,timeline,help,settings})[tab]();renderSave();}
function next(){let w=F.workload(state),cost=Math.round((state.workers*180000+150000+state.machines.tractor*15000+state.machines.combine*20000+state.plots.filter(p=>p.type==='house').length*2000)*w.months),winter=state.month===12;let upcoming=state.plots.filter(p=>!p.crop&&F.CROPS[p.plan]?.plant===state.month).reduce((v,p)=>v+state.cropSettings[p.plan].cost*p.areaA/10,0);let winterExtra=winter?state.plots.reduce((v,p)=>v+p.rent,0)+Math.round(state.debt*.03)+Math.min(state.debt,state.loanPayment)+(state.weather==='snow'?state.plots.filter(p=>p.type==='house').length*30000:0):0;openDialog(`${monthText(state.month)}を進めますか？`,`<p>${winter?'12〜3月の4か月分をまとめて処理し、決算して次の4月に進みます。秋小麦は翌7月まで畑に残ります。':'今月の植付・手入れ・出荷を実行して、翌月へ進みます。'}</p><div class="dialog-info">固定費 ${money(cost)}${upcoming?`<br>植付経費 ${money(upcoming)}`:''}${winter?`<br>地代・利息・元金返済等 ${money(winterExtra)}`:''}<br>売上は今月の収穫後に反映します。</div>${w.laborRatio<1||w.tractorRatio<1||w.combineRatio<1?'<p class="negative">今月は作業能力を超えています。戻って人員・機械・計画を調整することもできます。</p>':''}`,'この月を進める',()=>{let oldYear=state.year;F.advance(state);if(state.year!==oldYear){tab='accounts';viewYear=oldYear}save();render();if(state.gameOver)toast('経営が終了しました。年表に記録しました。');else if(state.year!==oldYear)toast(`${oldYear}年目の決算がまとまりました。`);else toast(`${monthText(state.month)}になりました。`)});}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab||b.dataset.goto){tab=b.dataset.tab||b.dataset.goto;render();return}if(b.id==='next-turn'){next();return}if(b.dataset.buy){let kind=b.dataset.buy,label=kind==='build'?'ハウス1棟（3a）':kind==='tractor'?'トラクター1台':'コンバイン1台',price=kind==='build'?1300000:kind==='tractor'?6000000:8000000;openDialog(`${label}を${kind==='build'?'建設':'購入'}`,`<p>${money(price)}を手元資金から支払います。${kind==='build'?'作付けを設定できるのは4月です。':''}</p>`,'確定する',()=>run(kind==='build'?'build':'machine',{kind}));return}if(b.dataset.offer){let o=state.offers.find(o=>o.id===b.dataset.offer),mode=b.dataset.mode;openDialog(`${typeName(o.type)} ${area(o.areaA)}を${mode==='buy'?'購入':mode==='rent'?'借用':'見送り'}`,`<p>${mode==='buy'?`${money(o.price)}を支払って購入します。`:mode==='rent'?`年${money(o.rent)}の借地料が毎年冬に発生します。初年度も全額です。`:'今年はこの区画を見送ります。'}${mode!=='decline'?'取得後に作付け計画を決めてください。売却・借地返却はできません。':''}</p>`,'確定する',()=>run('land',{id:o.id,mode}));return}if(b.dataset.hire){let delta=Number(b.dataset.hire);openDialog('パートの雇用',`<p>${delta>0?'1人増やすと、作業能力＋120時間/月、賃金＋18万円/月。今月から冬も含めて支払います。':'今月からパートを1人減らします。作業能力も120時間/月減少します。'}</p>`,'変更する',()=>run('hire',{delta}));return}let u=b.dataset.ui;if(!u)return;if(u==='settings-save'){try{let values=readSettingsInputs();openDialog('作物設定を保存しますか？','<p>単価・収量は今後の出荷、経費・労働は次の植付から反映します。過去の決算・取引・生育状態と、今年の市場倍率は変わりません。</p>','設定を保存する',()=>run('settings',{values}));}catch(e){toast(e.message)}return;}if(u==='settings-reset'){openDialog('作物設定を初期値に戻す','<p>5作物の基準単価・収量・経費・年間労働時間を初期値へ戻して保存します。単価・収量は今後の出荷、経費・労働は次の植付から反映。農場・資金・過去の決算・生育状態はそのままです。</p>','初期値に戻す',()=>run('resetSettings'));return;}if(u==='export'){try{download(F.serialize(state),`潮風の系譜_${state.year}年目_${state.month}月.json`);toast('セーブを書き出しました。')}catch(e){toast(e.message)}}else if(u==='import')$('#import-file').click();else if(u==='borrow'||u==='repay'){let amount=Number($('#loan-amount').value)*10000;openDialog(u==='borrow'?'農協から借り入れる':'借入を繰上返済する',`<p>${money(amount)}を${u==='borrow'?'借り入れます。年利3%、その冬から10年間の元金均等返済です。':'手元資金から返済します。古い借入から充当します。'}</p>`,'確定する',()=>run(u==='borrow'?'borrow':'repay',{amount}));}else if(u==='succeed'){openDialog('次の経営者を選ぶ',`<p>資金・借入・土地・機械・栽培中の作物をそのまま引き継ぎます。</p><label for="talent">後継者の得意分野</label><select id="talent">${['rice','flowers','machines'].map(t=>`<option value="${t}">${F.TALENTS[t].name}：${F.TALENTS[t].description}</option>`).join('')}</select>`,'28歳の後継者へ託す',()=>run('succeed',{talent:$('#talent').value}));}else if(u==='restart'){openDialog('新しい農場を始める',`<p>今の農場を新しい農場で置き換えます。続けたい記録は、戻って先に「書き出し」で保存してください。</p><p class="hint">ひとつ前の端末保存はバックアップに保持しますが、それ以降の操作で更新されます。</p>`,'新しく始める',()=>{if(saveBlocked){toast('先に破損データの復旧または書き出しを行ってください。');return}state=F.create();tab='farm';viewYear='current';save();render()});}else if(u==='corrupt-export'){download(corruptRaw||'',`潮風の系譜_破損保存_${Date.now()}.json`)}else if(u==='recover'){if(corruptRaw===null||conflictBlocked){toast('復旧対象ではありません。進行を書き出し、再読み込みしてください。');return}openDialog('復旧を確定する',`<p>破損した元データを端末内の別領域に退避してから、いま表示している農場で保存を再開します。重要な場合は先に破損データも書き出してください。</p>`,'復旧する',()=>{try{if(conflictBlocked||corruptRaw===null||localStorage.getItem(KEY)!==corruptRaw)throw Error('保存が変更されたため停止');localStorage.setItem(RECOVERY,corruptRaw);if(localStorage.getItem(RECOVERY)!==(corruptRaw||''))throw Error('退避失敗');if(recoveredBackup)protectLegacy(localStorage.getItem(BACKUP));let restored=F.serialize(state);localStorage.setItem(KEY,restored);if(localStorage.getItem(KEY)!==restored)throw Error('復旧の保存照合に失敗');lastPersisted=restored;saveBlocked=false;conflictBlocked=false;corruptRaw=null;saveBad=false;saveMessage='● 復旧して自動保存を再開';render();toast('復旧して保存を再開しました。')}catch{toast('復旧結果を確認できないため停止しました。進行を書き出し、再読み込みしてください。')}})}});
document.addEventListener('change',e=>{if(e.target.dataset.plan)run('plan',{id:Number(e.target.dataset.plan),crop:e.target.value});if(e.target.id==='account-year'){viewYear=e.target.value;render()} });
$('#modal-cancel').addEventListener('click',closeDialog);$('#modal').addEventListener('cancel',()=>{confirmHandler=null;processing=false});$('#modal-confirm').addEventListener('click',()=>{if(processing||!confirmHandler)return;processing=true;$('#modal-confirm').disabled=true;let fn=confirmHandler;try{fn()}catch(e){toast(e.message)}finally{closeDialog()}});
$('#import-file').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>12000000)throw Error('ファイルが大きすぎます（12MBまで）。');let importedRaw=await file.text(),candidate=F.parse(importedRaw);openDialog('セーブを読み込みますか？',`<p>${candidate.year}年目・${monthText(candidate.month)}、第${candidate.generation}代、${candidate.age}歳の農場です。</p><p>今の進行を置き換えます。必要なら「戻る」で今のセーブを書き出してください。</p>`,'この保存を読み込む',()=>{if(saveBlocked){toast(conflictBlocked?'別タブとの競合中です。進行を書き出し、再読み込みしてください。':'元の破損保存を保護中です。先に復旧を確定してください。');return}protectLegacy(importedRaw);state=candidate;tab='farm';viewYear='current';let saved=save();render();toast(saved?'セーブを読み込み、保存しました。':'セーブは表示中ですが保存できません。書き出してください。')});}catch(e){toast(e.message)}});
window.addEventListener('storage',e=>{if(e.key===KEY){saveBlocked=true;conflictBlocked=true;saveBad=true;saveMessage='別タブで保存が変わりました。この進行を書き出し、再読み込みしてください。';render();toast(saveMessage)}});
load();render();
})();
</script></body></html>
